version: "3.8"

services:
  roon-controller:
    # Published by .github/workflows/docker-image.yml on every push to main
    image: ghcr.io/jcharr1/roon-controller:main
    container_name: roon-controller
    restart: unless-stopped

    # HOST NETWORK is required so Roon's SOOD discovery (UDP multicast)
    # can find the Roon Core on your LAN.
    # This means the API will be available on the QNAP's own IP, port 3001.
    network_mode: host

    environment:
      - TZ=America/Chicago
      - PORT=3001

    # Persist the Roon authorisation token so you don't re-authorise
    # every time the container restarts
    volumes:
      # Pairing token (config.json) lives here; see Dockerfile
      - roon_auth:/app/data

volumes:
  roon_auth:
